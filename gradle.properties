org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# ---- AndroidX ----
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# ---- 签名参数（四元组）----
# 请勿把真实密钥提交到仓库！下面四项请放在以下任一位置（按优先级从高到低）：
#   1) 项目根目录的 keystore.properties（已写入 .gitignore，不会被提交）
#   2) 命令行 -P 参数：-PSTORE_FILE=... -PSTORE_PW=...
#   3) 环境变量：STORE_FILE / STORE_PW / KEY_ALIAS / KEY_PW
#   4) ~/.gradle/gradle.properties
# 详见 app/build.gradle 里的 readStore() 与 README 的「发布签名」一节。
#STORE_FILE=release.keystore
#STORE_PW=
#KEY_ALIAS=
#KEY_PW=

# ---- 签名开关（v1/v2/v3 默认开，v4 可选）----
V1_ON=true
V2_ON=true
V3_ON=true
V4_ON=false
