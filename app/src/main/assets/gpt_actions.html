<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<title>ChatGPT 回答操作栏</title>
<style>
    :root {
        /* 与 ChatGPT 原生操作行一致：行高 34dp、按钮 34dp、图标 18dp、
           相邻按钮间隔 2dp（中心距 36dp）。 */
        --bar-h: 34px;
        --cell: 34px;
        --cell-gap: 2px;
        --icon: 18px;
        --icon-color: #6B6B6F;
        --icon-hover: #3F3F44;
        --icon-active: #3262E6;
        --press-bg: #F0F0F2;
        --active-bg: #EDF1FD;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        width: 100%;
        height: var(--bar-h);
        background: transparent;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
    }

    .toolbar {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        height: var(--bar-h);
        padding: 0;
    }

    .action {
        position: relative;
        flex: 0 0 var(--cell);
        width: var(--cell);
        height: var(--bar-h);
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--icon-color);
        cursor: pointer;
        -webkit-appearance: none;
        appearance: none;
        -webkit-tap-highlight-color: transparent;
        transition: color .16s ease, transform .12s ease;
    }

    .action + .action { margin-left: var(--cell-gap); }

    /* 点按反馈只覆盖 30dp 的圆形区域，视觉图标仍保持 18dp。 */
    .action::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 30px;
        height: 30px;
        margin: -15px 0 0 -15px;
        border-radius: 50%;
        background: transparent;
        transition: background-color .16s ease;
        pointer-events: none;
    }

    .icon {
        display: block;
        position: relative;
        z-index: 1;
        width: var(--icon);
        height: var(--icon);
        margin: 0 auto;
        overflow: visible;
        pointer-events: none;
    }

    .action:active { transform: scale(.94); }
    .action:active::before { background: var(--press-bg); }

    .action:focus-visible {
        outline: 2px solid var(--icon-active);
        outline-offset: 2px;
    }

    @media (hover: hover) {
        .action:hover { color: var(--icon-hover); }
        .action:hover::before { background: var(--press-bg); }
        .action[aria-pressed="true"]:hover { color: var(--icon-active); }
        .action[aria-pressed="true"]:hover::before { background: var(--active-bg); }
    }

    .action[aria-pressed="true"] { color: var(--icon-active); }
    .action[aria-pressed="true"]::before { background: var(--active-bg); }

    .action--vol.is-speaking .icon {
        animation: icon-pulse .9s ease-in-out infinite;
    }

    @keyframes icon-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: .55; }
    }

    @media (prefers-reduced-motion: reduce) {
        .action, .action::before { transition: none; }
        .action--vol.is-speaking .icon { animation: none; }
    }
</style>
</head>

<script>
    (function () {
        "use strict";

        var state = { like: false, dislike: false, playing: false };
        var up = document.querySelector('[data-action="up"]');
        var down = document.querySelector('[data-action="down"]');
        var vol = document.querySelector('[data-action="vol"]');

        function render() {
            up.setAttribute("aria-pressed", state.like ? "true" : "false");
            down.setAttribute("aria-pressed", state.dislike ? "true" : "false");
            vol.setAttribute("aria-pressed", state.playing ? "true" : "false");
            vol.classList.toggle("is-speaking", state.playing);
            vol.setAttribute("aria-label", state.playing ? "停止朗读" : "朗读回答");
            vol.setAttribute("title", state.playing ? "停止朗读" : "朗读");
        }

        function send(action) {
            try {
                if (window.AndroidActions && window.AndroidActions.onAction) {
                    window.AndroidActions.onAction(String(action));
                    return true;
                }
            } catch (error) {
                /* Native bridge is unavailable in a plain browser preview. */
            }
            return false;
        }

        var buttons = document.querySelectorAll(".action");
        for (var i = 0; i < buttons.length; i++) {
            (function (button) {
                button.addEventListener("click", function (event) {
                    event.preventDefault();
                    send(button.getAttribute("data-action"));
                });
            })(buttons[i]);
        }

        document.addEventListener("contextmenu", function (event) {
            event.preventDefault();
        }, false);

        window.GptActions = {
            setState: function (next) {
                if (!next) { return; }
                if (typeof next.like === "boolean") { state.like = next.like; }
                if (typeof next.dislike === "boolean") { state.dislike = next.dislike; }
                if (typeof next.playing === "boolean") { state.playing = next.playing; }
                render();
            },
            setReaction: function (value) {
                var next = Number(value) || 0;
                state.like = next === 1;
                state.dislike = next === 2;
                render();
            },
            setPlaying: function (value) {
                state.playing = !!value;
                render();
            }
        };

        // 与 DsActionsView 复用同一个原生同步入口；两套页面各自保留命名空间。
        window.DsActions = window.GptActions;

        render();
    })();
</script>
